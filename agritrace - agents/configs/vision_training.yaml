# AgriTrace Vision-D121 Training & Fine-Tuning Configuration
model:
  name: "AgriTrace Vision-D121"
  architecture: "densenet121"
  pretrained: true
  embedding_dim: 1024
  num_produce_classes: 9
  num_freshness_classes: 4
  num_defect_classes: 6

data:
  use_synthetic: false
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  random_seed: 42

training:
  batch_size: 32
  epochs_stage1: 2
  epochs_stage2: 3
  max_batches_per_epoch: 120
  learning_rate_head: 0.001
  learning_rate_backbone: 0.00002
  weight_decay: 0.0001
  mixed_precision: true
  num_workers: 0

image:
  size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

optimizer:
  name: "AdamW"

scheduler:
  name: "cosine"
  t_max: 20
  eta_min: 0.000001

loss:
  produce_weight: 1.0
  freshness_weight: 1.2
  quality_weight: 0.8
  defect_weight: 1.0

early_stopping:
  patience: 6
  min_delta: 0.001

paths:
  metadata: "data/metadata/agritrace_labels.csv"
  checkpoints_dir: "models/vision"
  reports_dir: "reports"
  experiments_dir: "experiments"
